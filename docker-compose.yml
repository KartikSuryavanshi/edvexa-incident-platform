services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edvexa
      POSTGRES_USER: edvexa
      POSTGRES_PASSWORD: edvexa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edvexa -d edvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://edvexa:edvexa@db:5432/edvexa
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  postgres_data:
